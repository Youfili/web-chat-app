  /wasatext/{username}/profile/username:
    put:                                               # Modifico il mio username
      operationId: setMyUserName
      summary: Update current user's username
      description: |-
        Updates the username of the currently authenticated user.  
        The request must include the new desired username in the request body.  
        If the username is valid and not already taken, it is updated successfully  
        and the updated user profile is returned.  
        If the username already exists, an error response is returned.
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
            maxLength: 30
            pattern: '^[a-zA-Z0-9._~-]+$'
          description: Username of the user loggin in this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsernameRequest"

      responses:
        '200':
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "f4a8c2d1-0e9b-41b6-bd3c-527ef43ac821"
                username: "Ryan_Ted"
                profilePhoto: "https://web-chat-app.com/users/profile-images/ryan_ted.png"

        '400':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



  /wasatext/{username}/profile/photo:
    put:
      operationId: setMyPhoto
      summary: Update current user's profile photo
      description: |-
        Updates the profile photo of the currently authenticated user.
        The request must include the new photo URL in the request body.
        If the URL is valid, the profile photo is updated successfully
        and the updated user profile is returned.
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
            maxLength: 30 
            pattern: '^[a-zA-Z0-9._~-]+$'
          description: Username of the user loggin in this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: profile photo
              properties:
                profilePhoto:
                  type: string
                  format: url
                  minLength: 10
                  maxLength: 500
                  pattern: '^https?:\/\/[^\s\/$.?#].[^\s]*$'
                  description: URL to new profile photo
              required:
                - profilePhoto
      responses:
        '200':
          description: Profile photo updated successfully
          content:
            application/json:
              schema:
