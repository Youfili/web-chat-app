      description: |-
        Updates the profile photo of the currently authenticated user.
        The request must include the new photo URL in the request body.
        If the URL is valid, the profile photo is updated successfully
        and the updated user profile is returned.
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
            maxLength: 30 
            pattern: '^[a-zA-Z0-9._~-]+$'
          description: Username of the user loggin in this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: profile photo
              properties:
                profilePhoto:
                  type: string
                  format: url
                  minLength: 10
                  maxLength: 500
                  pattern: '^https?:\/\/[^\s\/$.?#].[^\s]*$'
                  description: URL to new profile photo
              required:
                - profilePhoto
      responses:
        '200':
          description: Profile photo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "f4a8c2d1-0e9b-41b6-bd3c-527ef43ac821"
                username: "filippo_dev"
                profilePhoto: "https://web-chat-app.com/users/profile-images/filippo_new_photo.png"
        '400':
          description: Invalid URL format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



  /wasatext/{username}/users/{usernameSearched}:
    get:                                                                      # ritornare un profilo utente tramite id
      operationId: getUserProfile
      summary: Get user profile by ID
      description: I return the user profile by passing his username as a parameter in the path
