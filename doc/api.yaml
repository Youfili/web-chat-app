openapi: 3.0.4
info:
  title: FlowChat
  description:  API Web Chat App, University project
  version: 1.0.0
  
servers:
  - url: https://api.web-chat-app.com/v1
    description: Web Chat Application API Description

tags:
  - name: Users
    description: User management, search, and blocking
  - name: Conversations
    description: General conversation operations
  - name: Single Conversations
    description: One-to-one conversation management
  - name: Group Conversations
    description: Group conversation management and administration
  - name: Messages
    description: Message operations (send, edit, delete, reply, forward)
  - name: Reactions
    description: Message reaction operations
  - name: Media
    description: Media file upload and management
  - name: Notifications
    description: User notification management
  - name: Search
    description: Search functionality across messages and conversations
  - name: Favourites
    description: Favourite messages management

components:
  schemas:  
    
    User:
      type: object
      description: Representation of a User in the system.
      properties:
        id:
          type: string
          format: uuid
          description: Unique user id (UUID)
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: steph_curry
          pattern: '^[A-Za-z0-9_]+$'
          description: Unique username; only letters, numbers and underscore
        status:
          type: string 
          maxLength: 200
          description: User Status
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji                  
          example: "Available, write to me! :)"
        profilePhoto:
          type: string
          format: url                               # Url dell'immagine
          description: URL User profile photo
        dtRegistration:                            # Creato quando lo creo come nuovo utente 
          type: string
          format: date-time
          description: Account creation Date-Time (UTC)
        lastTimeOnline:
          type: string
          format: date-time
          description:  User Last Access on the App (UTC)
      required:
        - id 
        - username
        - profilePhoto
        - status
        - lastTimeOnline


    newUser:
      type: object
      description: Representation of a New User in the system.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: steph_curry
          pattern: '^[A-Za-z0-9_]+$'
          description: Unique username; only letters, numbers and underscore
        status:
          type: string 
          maxLength: 200
          description: User Status
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji                  
          example: "Available, write to me! :)"
        profilePhoto:
          type: string
          format: url                               # Url dell'immagine
          description: URL User profile photo
        dtRegistration:                            # Creato quando lo creo come nuovo utente 
          type: string
          format: date-time
          description: Account creation Date-Time (UTC)
        lastTimeOnline:
          type: string
          format: date-time
          description:  User Last Access on the App (UTC)
      required:
        - username
        - profilePhoto
        - status
        - lastTimeOnline




    GroupConversation:
      type: object
      description: Representation of a Group Conversation
      properties:
        id:
          type: string
          format: uuid
          description: Unique id Conversation
        groupName:
          type: string
          minLength: 1
          maxLength: 200
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji  
          example: BestShooters
          description: Group name
        groupDescription:
          type: string
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji  
          minLength: 0
          maxLength: 1000
          description: Group description
          example: "This group is only for people who don't shoot bricks :)"
        groupPhoto:
          type: string
          format: url
          description: Group photo
        members:
          description: List of users participating in the group
          type: array
          items:
            $ref: "#/components/schemas/User"     
          minItems: 1
          maxItems: 300  
        admins:
          description: List of admin users in the group
          type: array
          items:
            type: string
            format: uuid
            description: User IDs of group admins
          minItems: 1
          maxItems: 100
        dtCreated:
          type: string
          format: date-time
          description: date and time when the group was created
        snippet:              # anteprima
          type: string
          maxLength: 300
          description: Conversation snippet
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji            
          example: "Yeah, I want to talk about..."
        dtLastMessage:
          type: string
          format: date-time
          description: date and time of the last message in a Group Conversation
      required: 
        - groupName
        - members
        - dtCreated


    NewGroupConversation:
      type: object
      description: Representation of a NEW Group Conversation
      properties:
        groupName:
          type: string
          minLength: 1
          maxLength: 200
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji  
          description: Group name
        groupDescription:
          type: string
          minLength: 1
          maxLength: 1000
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji  
          description: Group description
        members:
          type: array
          items:
            type: string
            description: Username of member to add
            minLength: 3
            maxLength: 30
          minItems: 1                                   # almeno un utente deve essere unito al gruppo (quando creato)
          maxItems: 300
          description: Group members
      required: 
        - groupName
        - members
        

    SingleConversation:
      type: object
      description: Representation of a Single Conversation
      properties:
        id:
          type: string
          format: uuid
          description: Unique Single Conversation Id
        recipientUser:
          $ref: "#/components/schemas/User"
        snippet:              # anteprima
          type: string
          maxLength: 300
          #pattern:            Validare/Sanificare lato server  # pattern che permette Testo + Emoji  
          example: "Yeah, I want to talk about..."
          description: Single Conversation snippet
        dtLastMessage:
          type: string
          format: date-time
          description: date and time of the last message in a Sigle Conversation
        userPhoto:
          type: string
          format: url
          description: User Photo
      required: 
        - id 
        - recipientUser


    NewSingleConversation:
      type: object
      description:  Representation of a NEW Single Conversation
      properties:
        recipientUserUsername:
          type: string
          minLength: 3
          maxLength: 30
          description: recipient username
        initialMessage:
          type: string
          minLength: 1
          maxLength: 5000
          description: First message to send in the conversation
      required: 
        - recipientUserUsername
        - initialMessage


    Message:
      type: object
      description: Representation of a Message in the system
      properties:
        id:
          type: string
          format: uuid
          description: Unique Message Id
        contentMess:
          type: string
          minLength: 1
          maxLength: 5000
          #pattern:            Validare/Sanificare lato server (testo + emoji + foto(o gif) anche Allegati (e tutte le permutazioni )
          description: Message content. May include text, emojis, links, and attachments.
        timestamp:
          type: string
          format: date-time
          description: Message timestamp
        statusInfo:
          type: string
          enum:
            - sent
            - delivered
            - read
          description: Message status
        conversationId:
          type: string
          format: uuid
          description: Unique Conversation Id
        senderUserId:
          type: string
          format: uuid
          description: User ID who sent the message
        senderUsername:
          type: string
          description: User who sent the message
        # deleted:
        #   type: boolean
        #   default: false
        #   description: Indicates whether a message has been deleted
        replyToMessageId:                 # id del messaggio a cui questo messaggio risponde (risposta intesa come feature specifica)
          type: string
          format: uuid
          description: ID of the message this is replying to (if any)
        forwarded:                        # Indica se il messaggio è stato inoltrato da qualche altra chat --> Boolean 
          type: boolean
          default: false
          description: Indicates if message was forwarded
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
          minItems: 0
          maxItems: 300                   # proprio come il numero massimo di utenti presenti in un gruppo
          description: Message Reactions

      required: 
        - id
        - contentMess
        - timestamp
        - conversationId
        - senderUserId
        - senderUsername


    NewMessage:
      type: object
      description: Representation of a New Message in the system
      properties:
        contentMess:
          type: string
          minLength: 1
          maxLength: 5000
          #pattern:            Validare/Sanificare lato server (testo + emoji + foto(o gif) anche Allegati (e tutte le permutazioni )
          description: Message content. May include text, emojis, links, and attachments.
        timestamp:
          type: string
          format: date-time
          description: Message timestamp
        statusInfo:
          type: string
          enum:
            - sent
            - delivered
            - read
          description: Message status
        conversationId:                     # E' già nel path
          type: string
          format: uuid
          description: Unique Conversation Id
        senderUserId:
          type: string
          format: uuid
          description: User ID who sent the message
        senderUsername:
          type: string
          description: User who sent the message
        replyToMessageId:                 # id del messaggio a cui questo messaggio risponde (risposta intesa come feature specifica)
          type: string
          format: uuid
          description: ID of the message this is replying to (if any)

      required: 
        - contentMess
        - timestamp
        - conversationId
        - senderUserId
        - senderUsername


    MessageUpdate:
      type: object
      description: Representation of a Message Update in the system
      properties:
        contentMess:                    # nuovo contenuto del messaggio
          type: string
          minLength: 1
          maxLength: 5000
          description: Content of new message (edited)
        # conversationId:                # E' gia nel Path dell'endpoint
        #   type: string
        #   format: uuid
        timestamp:
          type: string
          format: date-time
          description: New timestamp when the messagge was modified
      required: 
        - contentMess

    
    ReplyMessage:                       # Rispondere a un messaggio
      type: object
      description: Representation of a Reply to a Message 
      properties:
        contentMess:
          type: string
          minLength: 1
          maxLength: 5000
          description: Content of the reply message
        # conversationId:                # E' gia nel Path dell'endpoint
        #   type: string
        #   format: uuid
        #   description: Conversation Id in which the reply to the message is located
        replyToMessageId:
          type: string
          format: uuid
          description: Message ID of the message being replied to
      required: 
        - contentMess
        - replyToMessageId

     
    ForwardMessage:                   # Inoltra un messaggio
      type: object
      description: Representation of a forwarded message
      properties:
        messToForwardId:
          type: string
          format: uuid
          description: ID of message to forward
        conversationToForwardId:
          type: string
          format: uuid
          description: Conversation to forward the message
      required: 
        - messToForwardId
        - conversationToForwardId


    Reaction:
      type: object
      description: Representation of a reaction to a message
      properties:
        reactionId: 
          type: string
          format: uuid
          description: Reaction ID
        emoji:
          type: string
          #pattern:                            # Gestire questo pattern nel backend
          description: Emoji reaction
        timestamp:
          type: string
          format: date-time
          description: Reaction timestamp
        messToReactId:         
          type: string
          format: uuid
          description: The Messagge where will react           
        senderUserId:
          type: string
          format: uuid
          description: User who reacted
        senderUsername:
          type: string
          description: User username who reacted
      required: 
        - reactionId
        - emoji
        - timestamp
        - messToReactId
        - senderUserId
        - senderUsername


    NewReaction:
      type: object
      description: Representation of a New reaction to a message
      properties:
        emoji:
          type: string
          #pattern:                            # Gestire questo pattern nel backend
          description: Emoji reaction
        timestamp:
          type: string
          format: date-time
          description: Reaction timestamp
        messToReactId:         
          type: string
          format: uuid
          description: The Messagge where will react           
        senderUserId:
          type: string
          format: uuid
          description: User who reacted
        senderUsername:
          type: string
          description: User username who reacted
      required: 
        - emoji
        - timestamp
        - messToReactId
        - senderUserId
        - senderUsername


    Favourite:
      type: object
      description: Relationship between a user and their favourite message
      properties:
        id:
          type: string
          format: uuid
          description: Unique favourite ID
        userId:
          type: string
          format: uuid
          description: User who marked this as favourite
        messageId:
          type: string
          format: uuid
          description: The message marked as favourite
        conversationId:
          type: string
          format: uuid
          description: Conversation where the message belongs
        dateMarked:
          type: string
          format: date-time
          description: When the message was marked as favourite
      required:
        - id
        - userId
        - messageId
        - conversationId
        - dateMarked

    
    FavouriteMessageWithContext:
      type: object
      description: Favourite message with conversation context
      properties:
        favourite:
          $ref: "#/components/schemas/Favourite"
        message:
          $ref: "#/components/schemas/Message"
        conversationInfo:
          type: object
          properties:
            conversationId:
              type: string
              format: uuid
              description: Unique Conversation ID
            conversationType:
              type: string
              enum: 
                - single 
                - group
              description: Type of conversation in which the message added to favorites is located
            conversationName:
              type: string
              description: Username for single conversations, group name for groups
            conversationPhoto:
              type: string
              format: url
              description: Conversation photo


    AddMembersRequest:
      type: object
      description: Representation requested adding a member to a group
      properties:
        usersIdToAdd:
          type: array
          items:          ## singolo username da aggiungere
            type: string 
            format: uuid           
          minItems: 1
          #maxItems:                                                          # da gestire in backend, perchè sarebbe (300 - numPartecipantiAttuale)
          description: Array of usernames to add to the group
      required: 
        - usersIdToAdd



    Notification:
      type: object
      description: Representation of a message notification
      properties:
        id:
          type: string
          format: uuid
          description: Notification ID
        notificationType:
          type: string
          enum:
            - new_message
            - message_reply
            - message_mention
            - group_invite
            - group_member_added
            - group_member_removed
            - group_admin_promoted
            - group_admin_demoted
            - reaction_added
          description: Type of notification
        title:
          type: string
          description: Notification title
        body:
          type: string
          description: Notification body text
        relatedUserId:
          type: string
          format: uuid
          description: ID of user who triggered the notification
        relatedConversationId:
          type: string
          format: uuid
          description: ID of related conversation
        relatedMessageId:
          type: string
          format: uuid
          description: ID of related message (if applicable)
        timestamp:
          type: string
          format: date-time
          description: Notification timestamp
        read:
          type: boolean
          default: false
          description: Indicates whether the notification has been read or not
        data:
          type: object
          description: Additional notification-specific data
      required: 
        - id
        - notificationType
        - title
        - timestamp
        - read


    AdminRequest:
      type: object
      description: Representation of the request to make a member an administrator of the group
      properties:
        usernameId:
          type: string
          format: uuid
          description: Username ID of the user to make/remove as admin
      required:
        - usernameId


    UpdateUsernameRequest:
      type: object
      description: Requested representation to change your username
      properties:
        newUsername:
          type: string
          minLength: 3
          maxLength: 30
          description: New username (must be unique)
      required: 
        - newUsername


    ConversationStats:
      type: object
      description: Representation of conversation statistics
      properties:
        totalMessages:
          type: integer
          description: Total number of messages in the conversation
        totalMembers:
          type: integer
          description: Number of members (for groups)
        mediaCount:
          type: object
          description: Media Count 
          properties:
            images:
              type: integer
              description: Images
            videos:
              type: integer
              description: Video
            documents:
              type: integer
              description: Documents

    Error:
      type: object
      description: Textual representation of the error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: string
          description: Additional error details
      required: 
        - error
  
## ENDPOINTS

paths:

  /session:
    post:
      operationId: doLogin
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      requestBody:
        required: true
        description: User details
        content:
          application/json:
            schema:
              type: object
              description: Schema representing the user credentials required to perform login or account creation.
              properties:
                name:
                  type: string
                  example: Steph
                  minLength: 3
                  maxLength: 16
                  description: Login Name
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                description: Response containing the unique identifier of the logged-in or newly created user.
                properties:
                  identifier:
                    type: string
                    description: User Identifier (ID)
              example:
                identifier: "c12f8a3b-45d2-4baf-b27a-89dc4f3b5f9c"
  
  /register:                                                                                  # Registrare un nuovo utente
    post:
      operationId: registerUser
      tags: ["Users"]
      summary: Register a new user
      description: |-
        Creates a new user account with the provided credentials.
        Returns the user identifier and profile information upon successful registration.
        Username must be unique across the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: User registration details
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[A-Za-z0-9_]+$'
                  example: steph_curry
                  description: Unique username (letters, numbers, underscore only)
                status:
                  type: string
                  maxLength: 200
                  example: "New to FlowChat!"
                  description: Initial user status message
                profilePhoto:
                  type: string
                  format: url
                  description: URL to profile photo (optional, default avatar if not provided)
              required:
                - username
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    format: uuid
                    description: Unique user identifier
                  user:
                    $ref: "#/components/schemas/User"
              example:
                identifier: "f2a1b7d4-9c5e-4b2e-a6d3-8e1a9c7d5b22"
                user:
                  id: "f2a1b7d4-9c5e-4b2e-a6d3-8e1a9c7d5b22"
                  username: "steph_curry"
                  status: "New to FlowChat!"
                  profilePhoto: "https://web-chat-app.com/users/profile-images/default.png"
                  dtRegistration: "2025-11-09T10:30:00Z"
                  lastTimeOnline: "2025-11-09T10:30:00Z"
        '400':
          description: Invalid input or username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Username already exists"
                code: "USERNAME_TAKEN"
                details: "The username 'steph_curry' is already registered"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /conversations:                         # prendo tutte le conversazioni dell'utente loggato in corso --> Lista delle conversazioni (pannelllo a sinistra)
    get:
      operationId: getMyConversations
      summary: Get all conversations for the authenticated user
      description: |-
        Returns all conversations (single and group) ordered by last message 
        timestamp (most recent first)
      tags:
        - Conversations
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: object
                description: Conversations
                properties:
                  conversations:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/SingleConversation"
                        - $ref: "#/components/schemas/GroupConversation"  
                    minItems: 0
                    maxItems: 5000          # al massimo 5000 conversazioni può avere l'utente loggato in sessione
                    description: All the conversations of the user in session

              example:
                conversations:
                  - id: "7e2f13e0-8d9f-4df8-b1a1-4a56e6b943b2"
                    recipientUser:
                      id: "c5b9289e-cc09-4c32-9b5f-12629faecb8d"
                      username: "martina_02"
                      profilePhoto: "https://web-chat-app.com/profile-images/martina.jpg"
                      status: "online"
                    snippet: "Hey, how’s everything going?"
                    dtLastMessage: "2025-11-06T13:45:12Z"
                    userPhoto: "https://web-chat-app.com/users/profile-images/martina.jpg"

                  - id: "2f38b82e-8749-4659-bc1a-8e46f2769bb7"
                    groupName: "BestShooters"
                    groupDescription: "This group is only for people who don't shoot bricks :)"
                    groupPhoto: "https://web-chat-app.com/groups/profile-images/bestshooters.jpg"
                    snippet: "Let’s play at 8 PM tonight!"
                    dtLastMessage: "2025-11-06T12:30:05Z"
                    members:
                      - id: "c5b9289e-cc09-4c32-9b5f-12629faecb8d"
                        username: "martina_02"
                        profilePhoto: "https://cdn.web-chat-app.com/users/martina.jpg"
                        status: "online"
                      - id: "a8e92b10-742f-46c1-a4a5-f7c927fc73d2"
                        username: "fil_dev"
                        profilePhoto: "https://cdn.web-chat-app.com/users/filippo.jpg"
                        status: "offline"
                    admins:
                      - "a8e92b10-742f-46c1-a4a5-f7c927fc73d2"
                    dtCreated: "2025-09-01T18:00:00Z"


  /conversations/search:                 # ricerco una conversation specifica all'interno delle mie (utente loggato in sessione) conversazioni.
    get:
      operationId: getConversation
      summary: Search conversations by name
      description: Search for conversations (single or group) by name. Group names can contain emojis, usernames cannot.
      tags:
        - Conversations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1                  # lunghezza minima Gruppo = 1 ---  lunghezza minima username Utente = 3
            maxLength: 200               # massima lunghezza conversazione (sia singolo --> nome utente quindi già Max = 30) e di gruppo --> LunghezzaNomeGruppo = 200
            description: Conversation name or username to search for
          description: Searching Conversation
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                description: My Conversations (Single or Group)
                properties:
                  conversations:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/SingleConversation"
                        - $ref: "#/components/schemas/GroupConversation"
                    minItems: 0
                    maxItems: 5000                                 # al massimo un risultato della richiesta per una conversazione con un nome specifico (possono esistere conversazioni di Gruppo con Stesso Nome!)
                    description: Conversations returned
              example:
                conversations:                                  # Array di conversazioni (Single o Group)
                  # Caso Esempio Single Conversation
                  - id: "a12f45b0-67c3-4b2f-9a8d-4a9824b1c0d1"
                    recipientUser:
                      id: "d27e91a2-4f51-4a89-9e33-1efbc6b38e92"
                      username: "marta_22"
                      status: "Just chilling..."
                      profilePhoto: "https://web-chat-app.com/users/progile-images/marta_22.png"
                      dtRegistration: "2024-04-12T09:30:00Z"
                      lastTimeOnline: "2025-11-05T10:14:00Z"
                    snippet: "See you later!"
                    dtLastMessage: "2025-11-05T09:50:12Z"
                    userPhoto: "https://web-chat-app.com/images/marta_22.png"
        
                  # Caso Esempio Group Conversation
                  - id: "b78e34c1-92de-412f-83f1-8a0e2327c7a4"
                    groupName: "WASA Programmers"
                    groupDescription: "A group for Wasa lovers and learners"
                    groupPhoto: "https://web-chat-app.com/groups/profile-images/.png"
                    snippet: "New homework posted today!"
                    dtLastMessage: "2025-11-04T22:15:45Z"
                    members:
                      - id: "e91b8a23-8d0f-4e2d-a4e1-7c6c34b7f345"
                        username: "LebronJames"
