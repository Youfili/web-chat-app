  /wasatext/{username}/conversations/{conversationId}/messages/{messageId}/forward:
    post:                                                             # Inoltrare un messaggio
      operationId: forwardMessage
      summary: Forward a message to another conversation
      description: |-
        Creates a NEW message in the target conversation (specified in body) with the same content 
        as the original message. 
        The new message will have 'forwarded: true', a new timestamp (current time), 
        and the sender will be the current user (not the original author).
        -'targetConversationId': The message is appended to that specific chat.
        - 'targetUserId': if user choose a new private conversation The backend searches for a new private chat with this user.
      tags:
        - Messages
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
            maxLength: 30              
            pattern: '^[a-zA-Z0-9._~-]+$'
          description: Username of the user loggin in this session
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36     
            maxLength: 36      
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Unique Conversation ID
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36     
            maxLength: 36      
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Unique Message ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessage"           
        
      responses:
        '201':
          description: Message forwarded successfully (New message created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                id: "2e1f9b33-5c7a-4af8-b83e-9f12aa49d223"
                contentMess: "📸 Check out this photo!"
                timestamp: "2025-11-21T18:30:00Z"           # Timestamp aggiornato al momento in cui viene fatto il forward
                statusInfo: "delivered"
                conversationId: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                senderUserId: "d8f1a7c3-6e29-430a-bb42-73a92fe83d6c"
                senderUsername: "filippo_dev"
                forwarded: true                             # Flag fondamentale da andare a cambiare nel backend
                reactions: []

        '400': 
          description: Invalid input (Must provide either targetConversationId or targetUserId)
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/Error"

        '403':
          description: User is not part of source or target conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Message or conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"





