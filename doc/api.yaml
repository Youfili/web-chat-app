                    contentMess: "Absolutely! Let’s go ⚽🔥"
                    timestamp: "2025-11-05T10:27:12Z"
                    statusInfo: "delivered"
                    conversationId: "a92d94b8-6fa3-46c3-a2e3-0e8b8a3c7e2f"
                    senderUserId: "b9d2a12e-9b52-43a9-8fd0-1a552f937f82"
                    senderUsername: "lucas"
                    # deleted: false
                    replyToMessageId: "e1f7b4a2-31e6-4b3d-99a1-4cc3c3e2f8c7"
                    forwarded: false
                    reactions:
                      - emoji: "💪"
                        userId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"

                  - id: "7bfa4e12-5d93-43a4-b1d8-f61cb211d87b"
                    contentMess: "Sending you the lineup PDF 📄"
                    timestamp: "2025-11-05T10:30:01Z"
                    statusInfo: "sent"
                    conversationId: "a92d94b8-6fa3-46c3-a2e3-0e8b8a3c7e2f"
                    senderUserId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"
                    senderUsername: "matthew"
                    # deleted: false
                    replyToMessageId: null
                    forwarded: true
