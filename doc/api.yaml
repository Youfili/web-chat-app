      summary: Search messages across all conversations
      description: Search for a specific message, the message can be found in all (still saved) conversations the user has had
      tags:
        - Search
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string  
            minLength: 1
          description: Search query text
        - name: conversationId
          in: query
