                $ref: "#/components/schemas/Error"



  ########################################
      # ENDPOINTS dei MESSAGGI
  ########################################      

  /wasatext/{username}/conversations/{conversationId}/messages:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          minLength: 3                 
          maxLength: 30   
          pattern: '^[a-zA-Z0-9._~-]+$'
        description: Username of the user loggin in this session
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36     
          maxLength: 36      
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        description: Unique Conversation ID
    
    get:                                                # ritorna i messaggi di una specifica conversazione
      operationId: getConversation
      summary: Get all messages in a conversation
      description: Returns messages in reverse chronological order (newest first)
      tags:
        - Messages
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                description: List of messages
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                    minItems: 1 # in ogni conversazione c'è almeno 1 messaggio (se una conversazione è iniziata, vuol dire che c'è almeno un messaggio --> per come l'ho implementata)
                    maxItems: 100000
                    description: Messages in reverse chronological order in this Conversation
              example:
                messages:
                  - id: "d8f1a7c3-6e29-430a-bb42-73a92fe83d6c"
                    contentMess: "Hey everyone 👋 ready for tonight’s match?"
                    timestamp: "2025-11-05T10:25:43Z"
                    statusInfo: "read"
                    conversationId: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                    senderUserId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"

                  - id: "c8b6d99b-7d52-4a4d-b88a-f82f62221f31"
                    contentMess: "Absolutely! Let’s go ⚽🔥"
                    timestamp: "2025-11-05T10:27:12Z"
                    statusInfo: "delivered"
                    conversationId: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                    senderUserId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"
                  

                  - id: "7bfa4e12-5d93-43a4-b1d8-f61cb211d87b"
                    contentMess: "Sending you the lineup PDF 📄"
                    timestamp: "2025-11-05T10:30:01Z"
                    statusInfo: "read"
                    conversationId: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                    senderUserId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"
                    
        '403':
          description: User is not part of this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



    post:                                                                     # invio di un nuovo messaggio
      operationId: sendMessage
      summary: Send a new message
      description: Sending a new message in this conversation
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: "#/components/schemas/NewMessage"
      responses:
        '201':    # Created
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                id: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                contentMess: "Hey guys, I just created the group event for tonight 🎉"
                timestamp: "2025-11-05T10:48:31Z"
                statusInfo: "read"
                conversationId: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                senderUserId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"
        '403':
          description: User is not part of this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /wasatext/{username}/conversations/{conversationId}/messages/{messageId}:
    parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
            maxLength: 30  
            pattern: '^[a-zA-Z0-9._~-]+$'
          description: Username of the user loggin in this session
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36     
            maxLength: 36      
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Unique Conversation ID
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36     
            maxLength: 36      
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Unique Message ID
  
    patch:                                                                        # Modifico un Messaggio
      operationId: editMessage
      summary: Edit a message content
      description: Update the text content of an existing message. Only the sender can edit.
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        '200':
          description: Message updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                id: "c1f09a5d-44e2-4f7b-9a33-82dfcc19b4fe"
                contentMess: "Hey guys, change of plans — meeting at 8:30 instead of 8 ⏰"
                timestamp: "2025-11-05T11:10:45Z"
                statusInfo: "delivered"
                conversationId: "e34f0b12-52a9-489c-87ce-a91e0fb4476d"
                senderUserId: "a3f1c8b2-47e9-4db5-93a8-921ddbb512fc"

        '403':
          description: User is not the sender of this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


    delete:                                                   # Utente elimina un messaggio da lui inviato in quella conversazione
      operationId: deleteMessage
      summary: Delete a message
      description: Only the sender can delete their own messages
      tags:
        - Messages
      responses:
        '204':  # No Content
          description: Message deleted successfully
        '403':
          description: User is not the sender of this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /wasatext/{username}/conversations/{conversationId}/messages/{messageId}/forward:
    post:                                                             # Inoltrare un messaggio
      operationId: forwardMessage
      summary: Forward a message to another conversation
      description: Forward an existing message to a different conversation
      tags:
        - Messages
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
