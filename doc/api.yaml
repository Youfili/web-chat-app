          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"





  #######################
  # ENDPOINTS REACTION
  #######################

  /wasatext/{username}/conversations/{conversationId}/messages/{messageId}/reactions:
    parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3                 
            maxLength: 30   
            pattern: '^[a-zA-Z0-9._~-]+$'
          description: Username of the user loggin in this session
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36     
            maxLength: 36      
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Unique Conversation ID
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36     
            maxLength: 36      
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Unique Message ID
            
    post:                                       #Aggiungere una Reazione a un messaggio specifico
      operationId: commentMessage
      summary: Add a reaction to a message
      description: Add an emoji reaction to a message. Each user can only have one reaction per message.
      tags:
        - Reactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReaction"
      responses:
        '201':
          description: Reaction added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
              example:
                reactionId: "d8f1a7c3-6e29-430a-bb42-73a92fe83d6c"              ## id univoco reaction
                emoji: "🔥"                                                     ## emoji che rappresenta la reazione aggiunta           ## UUID utente che ha reagito
                senderUsername: "filippo_dev"                                   ## nome utente che ha reagito
        '400':
          description: User already reacted to this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


    delete:                                                               # Rimuovo una mia reazione a un messaggio (Un utente può rimuovere solo una propria reazione, non quella di altri (anche se admin, se siamo in un gruppo))
      operationId: uncommentMessage
      summary: Remove reaction from a message
      description: Remove the authenticated user's reaction from a message
      tags:
        - Reactions
      responses:
        '204':
          description: Reaction removed successfully
        '404':
          description: Message or reaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:                                                                # ritorno tutte le Reazioni a un messaggio specifico
      operationId: getAllMessageReactions
      summary: Get all reactions for a message
      description: I take all the reactions of a specific message
      tags:
        - Reactions
      responses:
        '200':
          description: List of reactions
          content:
            application/json:
              schema:
                type: object
                description: Reactions
                properties:
                  reactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reaction"
                    minItems: 0
                    maxItems: 300                                 # numero massimo di partecipanti in un gruppo --> di conseguenza anche il numero massimo di reazioni (visto che è una a testa)
                    description: All the reactions of this message
              example:
                reactions:
                  - reactionId: "9a74bc10-3f2e-4b19-a8c7-3b9e2df67611"
                    emoji: "❤️"
                    senderUsername: "martina_98"
                  - reactionId: "5c2e7f88-1b56-4d3f-934b-d18fc2092aa4"
                    emoji: "😂"
                    senderUsername: "luca_dev"


