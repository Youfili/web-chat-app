  # Media e Upload
  /media/upload:
    post:                                                       # caricamento di un "Media File"
      operationId: uploadMediaFile
      summary: Upload media file (image, video, document)
      description: |
        Upload a media file and receive a URL to include in message content.
        Supported formats:
        - Images: jpg, jpeg, png, gif, webp (max 10MB)
        - Videos: mp4, mov, avi (max 50MB)
        - Documents: pdf, doc, docx, txt, xlsx (max 20MB)
      tags:
        - Media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: File and file type
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                fileType:
                  type: string
                  enum: 
                    - image 
                    - video
                    - document
                  description: Type of media being uploaded
              required: 
                - file 
                - fileType
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                description: Url, media type, size and file name
                properties:
                  url:
                    type: string
                    format: url
                    description: URL of uploaded file
                  mediaType:
                    type: string
                    description: MIME type of the file
                  size:
                    type: integer
                    description: File size in bytes
                  filename:
                    type: string
                    description: Original filename
              example:
                url: "https://flowchatapp.com/uploads/2025/11/05/profile_picture_93a4b.png"
                mediaType: "image/png"
                size: 482193
                filename: "profile_picture.png"
        '400':
          description: Invalid file type or size exceeds limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



